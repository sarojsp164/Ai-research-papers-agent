name: AI Research Digest

on:
  schedule:
    # Every other day at 04:30 UTC (10:00 IST)
    - cron: '30 4 */2 * *'

# Ensure only one run at a time updates/pushes seen_papers.json
concurrency:
  group: seen-papers-update
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest

    # Give the job write access so it can commit seen_papers.json back
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          PAPERS_PER_TOPIC:      ${{ vars.PAPERS_PER_TOPIC || '4' }}
          TOP_K_PER_TOPIC:       ${{ vars.TOP_K_PER_TOPIC  || '3' }}
          DAYS_BACK:             ${{ vars.DAYS_BACK         || '2' }}
        run: python paper_agent.py

      - name: Commit updated seen_papers.json
        # Always run so the file is committed even if the agent partially failed
        if: always()
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add seen_papers.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update seen_papers [skip ci]"

          # Rebase onto latest master and retry push to avoid non-fast-forward races
          for i in 1 2 3 4 5; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (likely race). Retrying in 5s... attempt $i/5"
            sleep 5
          done

          echo "Failed to push after retries."
          exit 1
