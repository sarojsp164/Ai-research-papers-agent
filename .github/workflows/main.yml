
name: AI Research Digest

on:
  workflow_dispatch:
  schedule:
    # Every other day at 04:30 UTC (10:00 IST)
    - cron: '30 4 */2 * *'

# Ensure only one run at a time updates/pushes state files
concurrency:
  group: seen-papers-update
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest

    # Give the job write access so it can commit seen_papers.json back
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_USER_ID:         ${{ secrets.ADMIN_USER_ID }}
          PAPERS_PER_TOPIC:      ${{ vars.PAPERS_PER_TOPIC || '4' }}
          TOP_K_PER_TOPIC:       ${{ vars.TOP_K_PER_TOPIC  || '3' }}
          DAYS_BACK:             ${{ vars.DAYS_BACK         || '2' }}
        run: python paper_agent.py

      - name: Commit & push updated state files
        if: always()
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Make sure we are on master (not detached HEAD)
          git checkout master

          touch feedback_store.json
          git add seen_papers.json feedback_store.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update seen_papers [skip ci]"

          # Retry loop to handle races
          for i in 1 2 3 4 5; do
            echo "Syncing with origin/master (attempt $i/5)..."
            git fetch origin master

            # Rebase our new commit(s) onto the latest remote master
            git rebase origin/master

            # Push the rebased commit; --force-with-lease is safe here
            if git push --force-with-lease origin master; then
              echo "Pushed successfully."
              exit 0
            fi

            echo "Push rejected (race). Sleeping 5s..."
            sleep 5
          done

          echo "Failed to push after retries."
          exit 1
